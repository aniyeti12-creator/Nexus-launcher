<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div id="app" class="launcher-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-brand">
        <span class="brand-mark">NL</span>
        <span class="brand-name">NEXUS LAUNCHER</span>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item is-active" data-section="inicio">
          <span>Inicio</span>
        </button>
        <button type="button" class="nav-item" data-section="biblioteca">
          <span>Biblioteca</span>
        </button>
        <button type="button" class="nav-item" data-section="favoritos">
          <span>Favoritos</span>
        </button>
        <button type="button" class="nav-item" data-section="perfil">
          <span>Perfil</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="status-pill">v0.2 · UI Base</span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <h1 id="section-title" class="topbar-title">Inicio</h1>
        <div class="topbar-meta">
          <span class="meta-tag">Cyber-Neon · Sólido</span>
        </div>
      </header>

      <main id="main-content" class="main-content">
        <section class="panel">
          <span class="panel-badge">Fase 2 · Paso 5</span>
          <h2 class="panel-heading">Bienvenido a Nexus Launcher</h2>
          <p class="panel-copy">
            Estructura principal con barra lateral, cabecera superior y zona de trabajo lista para los siguientes pasos de navegación y biblioteca.
          </p>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
