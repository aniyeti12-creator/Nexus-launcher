<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background-color: #131824;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 2rem;
    }

    .badge {
      display: inline-block;
      background-color: rgba(0, 240, 255, 0.12);
      color: #00f0ff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .status {
      font-family: monospace;
      color: #22c55e;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Fase 1 · Paso 2 y 3</span>
    <h1>🎮 Nexus Launcher</h1>
    <p>Base inicial desplegada para comprobar el funcionamiento en GitHub Pages antes de montar la estructura modular y la interfaz completa.</p>
    <div id="status" class="status">Iniciando comprobación...</div>
  </main>

  <script>
    document.getElementById("status").textContent = "Estado: online y script ejecutado correctamente.";
  </script>
</body>
</html>
